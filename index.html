<style>

#cj{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:var(--c1d);overflow:hidden;font-family:'Fredoka','Comic Sans MS','Trebuchet MS',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;--u:4px;--c1:#d71920;--c1d:#b3121a;--c2:#f4c430;--c3:#1e5bd8}
#cj *{box-sizing:border-box}
#cj button{font-family:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;color:inherit}
#cj img{max-width:none;margin:0;padding:0;border:0;box-shadow:none;-webkit-user-drag:none;pointer-events:none}
#cj svg{display:block}
#cj .cj-bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(24px) brightness(.75);transform:scale(1.1)}
#cj .cj-stage{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*171.30);overflow:hidden;background:var(--c1);box-shadow:0 0 40px rgba(0,0,0,.5)}
#cj .cj-scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
#cj .cj-scr.on{opacity:1;visibility:visible}
#cj .cj-bg{position:absolute;inset:0;background-size:cover;background-position:center}
#cj .cj-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0) 40%,rgba(0,0,0,.05))}
#cj .cj-veil.dark{background:radial-gradient(circle at 50% 50%,rgba(40,0,0,.25),rgba(20,0,0,.75))}
#cj .cj-char{position:absolute;height:auto;filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1.2) rgba(0,0,0,.35));z-index:3}

/* HUD */
#cj .cj-hud{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);z-index:40;display:none}
#cj .cj-hud.show{display:block}
#cj .cj-slots{display:flex;gap:calc(var(--u)*1.6);background:rgba(255,255,255,.85);padding:calc(var(--u)*1.4);border-radius:calc(var(--u)*5);box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.18);border:calc(var(--u)*.6) solid var(--c2)}
#cj .cj-slot{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;background:#e9e2d0;display:flex;align-items:center;justify-content:center;transition:transform .4s}
#cj .cj-slot svg{width:65%;height:65%;fill:#c9bfa6;color:#c9bfa6}
#cj .cj-slot.got{background:var(--c1);transform:scale(1.15);animation:cjPop .5s}
#cj .cj-slot.got svg{fill:#fff;color:#fff}
#cj .cj-slot.star.got svg{fill:var(--c2)}
#cj .cj-round{position:absolute;top:calc(var(--u)*3);width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%!important;background:var(--c1)!important;border:calc(var(--u)*.7) solid #fff!important;box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.25);z-index:60;display:flex!important;align-items:center;justify-content:center}
#cj .cj-round svg{width:58%;height:58%;fill:#fff}
#cj .cj-music{right:calc(var(--u)*3)}
#cj .cj-music .off{display:none}
#cj .cj-music.muted .on{display:none}
#cj .cj-music.muted .off{display:block}
#cj .cj-replay{right:calc(var(--u)*16);display:none!important;background:var(--c3)!important}
#cj .cj-replay.show{display:flex!important}

/* Abertura */
#cj .cj-titlebox{position:absolute;top:8%;left:6%;right:6%;text-align:center;z-index:4;animation:cjDrop .9s cubic-bezier(.2,1.4,.4,1) both}
#cj .cj-kicker{display:inline-block;background:var(--c3);color:#fff;font-weight:600;font-size:calc(var(--u)*4);padding:calc(var(--u)*1.2) calc(var(--u)*4);border-radius:calc(var(--u)*6);border:calc(var(--u)*.6) solid #fff;box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.2)}
#cj .cj-title{margin:calc(var(--u)*2) 0 0;font-weight:700;font-size:calc(var(--u)*8.6);line-height:1.05;color:#fff;-webkit-text-stroke:calc(var(--u)*.35) #222;text-shadow:0 calc(var(--u)*1) 0 #222;letter-spacing:.01em}
#cj .cj-title span{font-size:calc(var(--u)*11);color:var(--c2);display:inline-block;transform:rotate(-2deg)}
#cj .cj-story{position:absolute;top:38%;left:7%;right:7%;z-index:4;background:rgba(255,255,255,.93);border:calc(var(--u)*.8) solid var(--c1);border-radius:calc(var(--u)*5);padding:calc(var(--u)*3.5) calc(var(--u)*4);text-align:center;font-size:calc(var(--u)*4.4);line-height:1.35;color:#333;font-weight:500;box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.18);animation:cjFade .8s .4s both}
#cj .cj-story b{color:var(--c1)}
#cj .cj-btn{display:inline-flex!important;align-items:center;justify-content:center;gap:calc(var(--u)*2);background:linear-gradient(#ffd84a,#f4b400)!important;color:#5a2b00!important;font-weight:700;font-size:calc(var(--u)*5.2);padding:calc(var(--u)*3) calc(var(--u)*7)!important;border-radius:calc(var(--u)*10)!important;border:calc(var(--u)*.8) solid #fff!important;box-shadow:0 calc(var(--u)*1.2) 0 #b07a00,0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.3);transition:transform .1s}
#cj .cj-go{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(10,20,60,.65)}
#cj .cj-go.on{display:flex}
#cj .cj-go-box{width:80%;background:#fff;border:calc(var(--u)*.8) solid var(--c1);border-radius:calc(var(--u)*6);padding:calc(var(--u)*5) calc(var(--u)*4.5);text-align:center;box-shadow:0 calc(var(--u)*1.2) 0 rgba(0,0,0,.25);animation:cjFade .3s both}
#cj .cj-go-box h3{margin:0 0 calc(var(--u)*2);font-size:calc(var(--u)*6);color:var(--c1);font-weight:700}
#cj .cj-go-box p{margin:0 0 calc(var(--u)*4);font-size:calc(var(--u)*4.4);line-height:1.35;color:#333;font-weight:500}
#cj .cj-go-row{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);align-items:center}
#cj .cj-go-ok{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(#ffd84a,#f4b400);color:#5a2b00;font-family:inherit;font-weight:700;font-size:calc(var(--u)*5);padding:calc(var(--u)*2.6) calc(var(--u)*7);border-radius:calc(var(--u)*10);border:calc(var(--u)*.8) solid #fff;box-shadow:0 calc(var(--u)*1.1) 0 #b07a00;cursor:pointer}
#cj .cj-go-back{background:none;border:0;font-family:inherit;font-weight:600;font-size:calc(var(--u)*4.4);color:var(--c3);text-decoration:underline;padding:calc(var(--u)*1.5);cursor:pointer}
#cj .cj-btn:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.3) 0 #b07a00}
#cj .cj-btn svg{width:calc(var(--u)*6);height:calc(var(--u)*6);fill:#5a2b00}
#cj .cj-start{position:absolute;left:50%;top:58%;transform:translateX(-50%);z-index:5;white-space:nowrap;animation:cjPulse 1.6s infinite}
#cj .cj-start:active{transform:translateX(-50%) translateY(calc(var(--u)*1))}
#cj .cj-skip{position:absolute;left:50%;top:66.5%;transform:translateX(-50%);z-index:5;color:#fff!important;font-size:calc(var(--u)*3.4);font-weight:600;text-decoration:underline;text-shadow:0 0 calc(var(--u)*1) #000,0 0 calc(var(--u)*1) #000;white-space:nowrap}

/* Capa completa opcional: conserva somente os controles sobre a arte. */
#cj #sIntro.cj-capa-arte .cj-titlebox,
#cj #sIntro.cj-capa-arte .cj-char,
#cj #sIntro.cj-capa-arte .cj-veil{display:none}
#cj #sIntro.cj-capa-arte .cj-start{top:auto;bottom:calc(var(--u)*12)}
#cj #sIntro.cj-capa-arte .cj-story{top:20%;font-size:calc(var(--u)*3.7);padding:calc(var(--u)*2.5) calc(var(--u)*3);background:rgba(255,255,255,.92);border-width:calc(var(--u)*.55)}
#cj #sIntro.cj-sem-missao .cj-story{display:none}
#cj #sIntro.cj-capa-arte .cj-skip{top:auto;bottom:calc(var(--u)*5)}

/* Fases */
#cj .cj-bubble{position:absolute;top:calc(var(--u)*17);left:5%;right:5%;z-index:30;background:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*3) calc(var(--u)*4);font-size:calc(var(--u)*4.3);line-height:1.3;color:#333;font-weight:500;border:calc(var(--u)*.7) solid #222;box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.25);animation:cjDrop .7s cubic-bezier(.2,1.4,.4,1) both}
#cj .cj-bubble>b{display:block;font-size:calc(var(--u)*5);margin-bottom:calc(var(--u)*.8)}
#cj .cj-bubble span b{color:var(--c1)}
#cj .cj-phase{position:absolute;bottom:calc(var(--u)*3);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:calc(var(--u)*3.2);font-weight:600;padding:calc(var(--u)*1) calc(var(--u)*3.5);border-radius:calc(var(--u)*5);z-index:20;white-space:nowrap}
#cj .cj-item{position:absolute;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .4s;z-index:10}
#cj .cj-item.show{transform:translate(-50%,-50%) scale(1)}
#cj .cj-paw{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;background:rgba(255,255,255,.55);border:calc(var(--u)*.6) dashed #fff;display:flex;align-items:center;justify-content:center}
#cj .cj-paw svg{width:70%;height:70%;fill:#6b3e1e}
#cj .cj-paw.show.next{animation:cjBeat 1s infinite}
#cj .cj-paw.done{background:rgba(255,255,255,.2);border-color:transparent;opacity:.75}
#cj .cj-paw.done svg{fill:#8a5a2b}
#cj .cj-note{width:calc(var(--u)*20);height:calc(var(--u)*20);left:72%;top:32%;filter:drop-shadow(0 0 calc(var(--u)*3) #fff8a0)}
#cj .cj-note.show{animation:cjFloat 1.4s ease-in-out infinite}
#cj .cj-walker{width:calc(var(--u)*22);left:20%;top:96%;transform:translate(-50%,-100%) scale(1);transition:left .7s ease-in-out,top .7s ease-in-out,transform .7s;z-index:12}
#cj .cj-gift{width:calc(var(--u)*21);height:calc(var(--u)*21)}
#cj .cj-gift svg{width:100%;height:100%;overflow:visible}
#cj .cj-gift .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 40%}
#cj .cj-gift.open .lid{transform:translate(-14px,-34px) rotate(-28deg)}
#cj .cj-gift.shake{animation:cjShake .45s}
#cj .cj-gift.show:not(.open){animation:cjWiggle 2.6s ease-in-out infinite}
#cj .cj-gift .empty{position:absolute;left:50%;top:-10%;transform:translateX(-50%);font-weight:700;font-size:calc(var(--u)*4);color:#fff;-webkit-text-stroke:calc(var(--u)*.25) #222;opacity:0;white-space:nowrap;transition:opacity .3s,top .6s}
#cj .cj-gift.open .empty{opacity:1;top:-25%}
#cj .cj-gift .bowup{position:absolute;left:50%;top:30%;width:70%;transform:translate(-50%,0) scale(0);transition:transform .7s cubic-bezier(.2,1.6,.4,1) .2s}
#cj .cj-gift.win .bowup{transform:translate(-50%,-90%) scale(1.3)}
#cj .cj-star{width:calc(var(--u)*17);height:calc(var(--u)*17);filter:drop-shadow(0 0 calc(var(--u)*2) #fff6a0)}
#cj .cj-star svg{width:100%;height:100%;fill:var(--c2);stroke:#b07a00;stroke-width:4;stroke-linejoin:round;animation:cjTwinkle 1.2s ease-in-out infinite}
#cj .cj-star.fly{transition:left .8s ease-in,top .8s ease-in,transform .8s ease-in,opacity .8s;transform:translate(-50%,-50%) scale(.3);opacity:0}
#cj .cj-chest{position:absolute;left:66%;top:84%;width:calc(var(--u)*38);height:calc(var(--u)*34);transform:translate(-50%,-100%);z-index:8}
#cj .cj-chest-base{position:absolute;bottom:0;left:0;width:100%;height:auto}
#cj .cj-chest-lid{position:absolute;left:0;width:100%;height:auto;bottom:calc(var(--u)*21);transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
#cj .cj-chest.open .cj-chest-lid{transform:translateY(calc(var(--u)*-3)) rotate(-24deg) translateX(calc(var(--u)*-6))}
#cj .cj-count{position:absolute;left:50%;bottom:calc(var(--u)*-6);transform:translateX(-50%);background:#fff;border:calc(var(--u)*.6) solid var(--c2);border-radius:calc(var(--u)*5);padding:calc(var(--u)*.6) calc(var(--u)*3);font-weight:700;font-size:calc(var(--u)*4.4);color:#a0522d}
#cj .cj-glow{position:absolute;left:50%;bottom:calc(var(--u)*14);width:calc(var(--u)*60);height:calc(var(--u)*60);transform:translate(-50%,50%) scale(0);border-radius:50%;background:radial-gradient(circle,rgba(255,250,190,.95),rgba(255,220,80,.4) 40%,rgba(255,220,80,0) 70%);transition:transform 1s}
#cj .cj-chest.open .cj-glow{transform:translate(-50%,50%) scale(1)}
#cj .cj-minienv{position:absolute;left:50%;bottom:calc(var(--u)*14);width:calc(var(--u)*20);height:calc(var(--u)*13);transform:translate(-50%,0) scale(.3);opacity:0;background:var(--c1);border-radius:calc(var(--u)*1);border:calc(var(--u)*.5) solid #fff;transition:transform 1s .5s cubic-bezier(.2,1.4,.4,1),opacity .4s .5s}
#cj .cj-minienv:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,var(--c1d) 50%,transparent 52%),linear-gradient(to bottom left,transparent 49%,var(--c1d) 50%,transparent 52%);background-size:100% 100%}
#cj .cj-chest.open .cj-minienv{transform:translate(-50%,calc(var(--u)*-22)) scale(1.3) rotate(-6deg);opacity:1}

/* Vídeos: reprodução dentro da página, sem cortar as bordas */
#cj .cj-video-screen{background:#161009}
#cj .cj-video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;max-width:none;pointer-events:none;background:#161009}
#cj .cj-envelope-start{position:absolute;inset:0;width:100%;height:100%;z-index:6;display:block}
#cj .cj-envelope-start.hide{display:none}
#cj .cj-envtitle{position:absolute;display:block;top:12%;left:4%;right:4%;text-align:center;z-index:5;color:#fff;font-weight:700;font-size:calc(var(--u)*6.5);line-height:1.1;-webkit-text-stroke:calc(var(--u)*.3) #222;text-shadow:0 calc(var(--u)*.8) 0 #222}
#cj .cj-envtitle span{color:var(--c2);font-size:calc(var(--u)*8)}
#cj .cj-tap{position:absolute;display:block;left:50%;bottom:12%;transform:translateX(-50%);z-index:7;background:#fff;color:var(--c1);font-weight:700;font-size:calc(var(--u)*4.4);padding:calc(var(--u)*2.4) calc(var(--u)*4);border-radius:calc(var(--u)*8);border:calc(var(--u)*.7) solid var(--c2);white-space:nowrap;animation:cjPulse 1.4s infinite}
#cj .cj-video-skip{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*4);z-index:15;border-radius:calc(var(--u)*6)!important;background:rgba(0,0,0,.7)!important;color:#fff!important;font-size:calc(var(--u)*3.8);font-weight:600;padding:calc(var(--u)*2) calc(var(--u)*4)!important;border:calc(var(--u)*.45) solid rgba(255,255,255,.8)!important}
#cj .cj-video-wait{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*3);background:rgba(0,0,0,.3);font-size:calc(var(--u)*4);color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
#cj .cj-video-wait.on{display:flex}
#cj .cj-video-retry{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*4);padding:calc(var(--u)*6);background:rgba(0,0,0,.72);color:#fff;text-align:center}
#cj .cj-video-retry.on{display:flex}
#cj .cj-video-retry p{font-family:inherit;font-size:calc(var(--u)*4.5);line-height:1.4;margin:0}

/* Convite */
#cj .cj-invimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cj #sInv{transform:scale(.85);transition:opacity .8s,visibility .8s,transform .9s cubic-bezier(.2,1.3,.4,1)}
#cj #sInv.on{transform:scale(1)}
#cj .cj-hot{position:absolute;z-index:5;display:block;border-radius:calc(var(--u)*4)!important;background:transparent!important;cursor:pointer;outline:none}
#cj .cj-hot:active{background:rgba(255,255,255,.25)!important}
#cj .cj-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* Overlay presentes */
#cj .cj-overlay{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#cj .cj-overlay.on{opacity:1;visibility:visible}
#cj .cj-ov-box{position:relative;width:88%;transform:scale(.8);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
#cj .cj-overlay.on .cj-ov-box{transform:scale(1)}
#cj .cj-ov-box img{width:100%;height:auto;display:block;border-radius:calc(var(--u)*3);box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.6)}
#cj .cj-x{position:absolute;top:calc(var(--u)*-4);right:calc(var(--u)*-4);width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%!important;background:var(--c1)!important;border:calc(var(--u)*.8) solid #fff!important;display:flex!important;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5)}
#cj .cj-x svg{width:62%;height:62%;fill:#fff}

/* Modal pista */
#cj .cj-modal{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#cj .cj-modal.on{opacity:1;visibility:visible}
#cj .cj-card{position:relative;width:84%;background:#fff;border-radius:calc(var(--u)*6);border:calc(var(--u)*1) solid var(--c2);padding:calc(var(--u)*24) calc(var(--u)*5) calc(var(--u)*6);text-align:center;transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.5,.4,1);box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.25)}
#cj .cj-modal.on .cj-card{transform:scale(1)}
#cj .cj-card-img{position:absolute;left:50%;top:calc(var(--u)*-16);height:calc(var(--u)*38);width:auto;transform:translateX(-50%);filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1) rgba(0,0,0,.3))}
#cj .cj-card-tag{display:inline-block;background:var(--c3);color:#fff;font-weight:600;font-size:calc(var(--u)*3.4);padding:calc(var(--u)*.8) calc(var(--u)*3);border-radius:calc(var(--u)*4)}
#cj .cj-card h2{margin:calc(var(--u)*2) 0;font-size:calc(var(--u)*7);color:var(--c1);font-weight:700;line-height:1.1;font-family:inherit}
#cj .cj-card p{margin:0 0 calc(var(--u)*5);font-size:calc(var(--u)*4.4);line-height:1.35;color:#444;font-weight:500}
#cj .cj-card p b{color:var(--c1)}

/* Loading */
#cj .cj-loading{position:absolute;inset:0;z-index:100;background:var(--c1);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);font-weight:600;font-size:calc(var(--u)*4.6);transition:opacity .5s,visibility .5s}
#cj .cj-loading.hide{opacity:0;visibility:hidden}
#cj .cj-spin{width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;border:calc(var(--u)*1.6) solid rgba(255,255,255,.3);border-top-color:var(--c2);animation:cjRot 1s linear infinite}

@keyframes cjRot{to{transform:rotate(360deg)}}
@keyframes cjPulse{0%,100%{scale:1}50%{scale:1.06}}

/* ----- Trilha (pegadas) ----- */
TYPES.trilha=function(m,ctx){
  var PAWS=m.pegadas, X=m.textos, cur=0, els=[];
  var s=ctx.s, box=el('div'), note=el('button','cj-item cj-note','<svg viewBox="0 0 100 100"><use href="#cjScroll"/></svg>');
  note.setAttribute('aria-label',T(X.rotuloPista||''));
  s.insertBefore(box,ctx.char); s.insertBefore(note,ctx.char);
  var pl=ctx.char; pl.classList.add('cj-walker');
  note.addEventListener('click',function(){
    if(!note.classList.contains('show'))return;
    ctx.clue(); ctx.done();
  });
  function reveal(i){els[i].classList.add('show','next')}
  function tap(i){
    if(i!==cur)return;
    sfx('tap'); var b=els[i]; b.classList.remove('next'); b.classList.add('done');
    var p=PAWS[i], sc=1-i*0.055;
    pl.style.left=p[0]+'%'; pl.style.top=(p[1]+4)+'%'; pl.style.transform='translate(-50%,-100%) scale('+sc+')';
    cur++;
    if(cur<PAWS.length){ctx.later(function(){reveal(cur)},350);
      if(cur===Math.min(3,PAWS.length-1))ctx.say(X.meio);}
    else{ctx.say(X.fim); ctx.later(function(){note.classList.add('show');sfx('star')},500)}
  }
  return {start:function(){
    box.innerHTML=''; els=[]; cur=0;
    pl.style.left='18%'; pl.style.top='97%'; pl.style.transform='translate(-50%,-100%) scale(1)';
    note.classList.remove('show'); note.style.left=m.pergaminho[0]+'%'; note.style.top=m.pergaminho[1]+'%';
    ctx.say(X.msg);
    PAWS.forEach(function(p,i){
      var b=el('button','cj-item cj-paw'+(m.item?' img':''),itemHtml(m,'<svg viewBox="0 0 100 100" style="transform:rotate('+(i%2?20:-20)+'deg)"><use href="#cjPaw"/></svg>'));
      b.style.left=p[0]+'%';b.style.top=p[1]+'%'; b.setAttribute('aria-label',T(X.rotulo||''));
      b.addEventListener('click',function(){tap(i)});
      box.appendChild(b); els.push(b);
    });
    ctx.later(function(){reveal(0)},700);
  }};
};

TYPES.cadeado=function(m,ctx){

  var wrap=el('div','cj-lockbox'), disp=el('div','cj-code'), pad=el('div','cj-pad'), digs=[];

  wrap.appendChild(pad); ctx.s.insertBefore(wrap,ctx.char);
  function paint(){digs.forEach(function(d,i){d.textContent=i<buf.length?buf.charAt(i):''})}

    if(lock)return;

    }

};

/* ----- Ajudantes dos novos tipos ----- */
function tone(f,dur){
  try{
    if(muted)return;
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime,d=dur||0.35;
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function stageXY(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,w:r.width,h:r.height}}

    box.innerHTML='';
    order.forEach(function(p,slot){
      var d=el('button','cj-piece'+(slot===sel?' sel':'')); var c=p%g, r=Math.floor(p/g);

    var im=new Image(); im.onload=function(){if(im.naturalWidth&&im.naturalHeight)ar=im.naturalWidth/im.naturalHeight;size()}; im.src=src; size();
    var o; do{o=shuffle(Array.apply(null,{length:g*g}).map(function(_,i){return i}))}while(o.every(function(v,i){return v===i}));

/* ----- Raspadinha (raspar para revelar a pista) ----- */
TYPES.raspadinha=function(m,ctx){
  var X=m.textos, box=el('div','cj-scr3'), under=el('div','cj-under'), cv=document.createElement('canvas'), GX=18, GY=14, hit={}, over=false, down=false, last=null, W=10, H=10, R=18;
  if(m.imagem)under.innerHTML='<img class="cj-itimg" alt="" src="'+esc(m.imagem)+'">'; else under.innerHTML='<div class="cj-underx"></div>';
  box.appendChild(under); box.appendChild(cv); ctx.s.insertBefore(box,ctx.char);
  function paint(){
    var r=box.getBoundingClientRect(); W=cv.width=Math.max(10,Math.round(r.width)); H=cv.height=Math.max(10,Math.round(r.height)); R=Math.max(16,W*0.075);
    var c=cv.getContext('2d'); c.globalCompositeOperation='source-over';
    var gr=c.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#c9ced6'); gr.addColorStop(.5,'#eef0f3'); gr.addColorStop(1,'#aeb4be');
    c.fillStyle=gr; c.fillRect(0,0,W,H); c.fillStyle='rgba(60,60,70,.45)'; c.font='700 '+Math.round(W/8)+'px Fredoka,Arial,sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(T(X.raspe||'RASPE AQUI'),W/2,H/2); hit={};
  }
  function scratch(e){
    if(over)return; var r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height), c=cv.getContext('2d');
    c.globalCompositeOperation='destination-out'; c.lineCap='round'; c.lineWidth=R*2; c.beginPath();
    if(last){c.moveTo(last[0],last[1]);c.lineTo(x,y);c.stroke()}else{c.arc(x,y,R,0,6.2832);c.fill()}
    last=[x,y];
    for(var gx=Math.max(0,Math.floor((x-R)/W*GX));gx<=Math.min(GX-1,Math.floor((x+R)/W*GX));gx++)for(var gy=Math.max(0,Math.floor((y-R)/H*GY));gy<=Math.min(GY-1,Math.floor((y+R)/H*GY));gy++)hit[gx+'_'+gy]=1;
    if(Object.keys(hit).length/(GX*GY)>=0.5){over=true;cv.style.transition='opacity .6s';cv.style.opacity='0';sfx('win');ctx.say(X.fim);ctx.clue();ctx.later(ctx.done,1500)}
  }
  cv.addEventListener('pointerdown',function(e){down=true;last=null;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);scratch(e);e.preventDefault()});
  cv.addEventListener('pointermove',function(e){if(down)scratch(e)});
  function up(){down=false;last=null}
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  return {start:function(){over=false;down=false;last=null;cv.style.transition='none';cv.style.opacity='1';ctx.say(X.msg);ctx.later(paint,50);paint()}};
};

      else{accept=false;sfx('no');ctx.say(X.errou);ctx.later(play,1400)}
    });
    pads.push(p); box.appendChild(p);
  })(i)}
  ctx.s.insertBefore(box,ctx.char);
  function flash(k,ms){pads[k].classList.add('lit');tone(FREQ[k],.3);ctx.later(function(){pads[k].classList.remove('lit')},ms||380)}
  function play(){accept=false;pos=0;ctx.say(X.observe);seq.forEach(function(k,j){ctx.later(function(){flash(k)},900+j*650)});ctx.later(function(){accept=true;ctx.say(X.sua)},900+seq.length*650)}
  return {start:function(){seq=[];for(var j=0;j<L;j++)seq.push(Math.floor(Math.random()*4));accept=false;ctx.say(X.msg);ctx.later(play,900)}};
};

/* ----- Arrastar (levar o objeto até o destino) ----- */
TYPES.arrastar=function(m,ctx){
  var X=m.textos, O=m.origem, D=m.destino, box=el('div'), down=false, over=false;
  var dest=el('div','cj-dest'+(m.destinoImg?' img':''),m.destinoImg?'<img class="cj-itimg" alt="" src="'+esc(m.destinoImg)+'">':'<svg viewBox="0 0 100 100"><use href="#cjLock"/></svg>');
  var it=el('div','cj-drag'+(m.item?' img':''),itemHtml(m,'<svg viewBox="0 0 100 100" style="fill:#f4c430;stroke:#8a6a00;stroke-width:3"><use href="#cjKey"/></svg>'));
  it.setAttribute('role','img'); it.setAttribute('aria-label',T(X.rotulo||''));
  box.appendChild(dest); box.appendChild(it); ctx.s.insertBefore(box,ctx.char);
  function place(x,y,anim){it.style.transition=anim?'left .35s,top .35s':'none';it.style.left=x+'%';it.style.top=y+'%'}
  it.addEventListener('pointerdown',function(e){if(over)return;down=true;it.setPointerCapture&&it.setPointerCapture(e.pointerId);it.classList.add('grab');e.preventDefault()});
  it.addEventListener('pointermove',function(e){if(!down)return;var p=stageXY(e);place(p.x,p.y,false)});
  function end(e){
    if(!down)return; down=false; it.classList.remove('grab');
    var p=stageXY(e), dx=(p.x-D[0])*p.w/100, dy=(p.y-D[1])*p.h/100;
    if(Math.sqrt(dx*dx+dy*dy)<p.w*0.16){over=true;place(D[0],D[1],true);dest.classList.add('ok');sfx('win');ctx.say(X.fim);ctx.clue();ctx.later(ctx.done,1200)}
    else{sfx('no');ctx.say(X.errou);place(O[0],O[1],true)}
  }
  it.addEventListener('pointerup',end); it.addEventListener('pointercancel',end);
  return {start:function(){over=false;down=false;dest.classList.remove('ok');dest.style.left=D[0]+'%';dest.style.top=D[1]+'%';place(O[0],O[1],false);ctx.say(X.msg)}};
};

/* ----- Ordem (tocar nos números de 1 a N) ----- */
TYPES.ordem=function(m,ctx){
  var X=m.textos, Q=Math.max(3,Math.min(9,m.quantidade||5)), box=el('div'), next=1;
  ctx.s.insertBefore(box,ctx.char);
  return {start:function(){
    box.innerHTML=''; next=1; ctx.say(X.msg);
    var cells=[]; for(var r=0;r<3;r++)for(var c=0;c<3;c++)cells.push([22+c*28,42+r*15]); cells=shuffle(cells);
    for(var n=1;n<=Q;n++)(function(k){
      var p=cells[k-1], b=el('button','cj-item cj-num'); b.textContent=k; b.style.left=(p[0]+rnd(-3,3))+'%'; b.style.top=(p[1]+rnd(-2,2))+'%'; b.setAttribute('aria-label',String(k));
      b.addEventListener('click',function(){
        if(b.classList.contains('done'))return;
        if(k===next){b.classList.add('done');sfx('tap');next++; if(next>Q){ctx.say(X.fim);sfx('win');ctx.clue();ctx.later(ctx.done,1100)}}
        else{b.classList.add('wrong');ctx.later(function(){b.classList.remove('wrong')},450);sfx('no');ctx.say(X.errou)}
      });
      box.appendChild(b); ctx.later(function(){b.classList.add('show')},200+k*90);
    })(n);
  }};
};

/* ----- Contar (quantos itens aparecem?) ----- */
TYPES.contar=function(m,ctx){
  var X=m.textos, Q=Math.max(1,Math.min(9,m.quantidade||3)), box=el('div','cj-contar'), field=el('div','cj-cfield'), row=el('div','cj-copts'), lock=false;
  box.appendChild(field); box.appendChild(row); ctx.s.insertBefore(box,ctx.char);
  return {start:function(){
    field.innerHTML=''; row.innerHTML=''; lock=false; ctx.say(X.msg);
    var cells=[]; for(var r=0;r<3;r++)for(var c=0;c<3;c++)cells.push([20+c*30,22+r*28]); cells=shuffle(cells).slice(0,Q);
    cells.forEach(function(p){var d=el('div','cj-citem'+(m.item?' img':''),itemHtml(m,'<svg viewBox="0 0 100 100" style="fill:#f4c430;stroke:#8a6a00;stroke-width:3"><use href="#cjStar"/></svg>'));d.style.left=(p[0]+rnd(-3,3))+'%';d.style.top=(p[1]+rnd(-3,3))+'%';field.appendChild(d)});
    var opts=[Q]; while(opts.length<3){var v=Math.max(1,Math.min(12,Q+Math.round(rnd(-3,3))));if(opts.indexOf(v)<0)opts.push(v)}
    shuffle(opts).forEach(function(v){
      var b=el('button','cj-opt cj-copt'); b.textContent=v;
      b.addEventListener('click',function(){
        if(lock)return;
        if(v===Q){lock=true;b.classList.add('ok');sfx('win');ctx.say(X.fim);ctx.clue();ctx.later(ctx.done,1100)}
        else{b.classList.add('bad');sfx('no');ctx.say(X.errou)}
      });
      row.appendChild(b);
    });
  }};
};

/* ----- Palavra (formar o nome) ----- */
TYPES.palavra=function(m,ctx){
  var X=m.textos, box=el('div','cj-word'), slots=el('div','cj-wslots'), tiles=el('div','cj-wtiles'), w='', pos=0;
  box.appendChild(slots); box.appendChild(tiles); ctx.s.insertBefore(box,ctx.char);
  return {start:function(){
    w=T(m.palavra||'{nome}').toUpperCase().replace(/\s+/g,'').slice(0,10); if(w.length<2)w='FESTA';
    slots.innerHTML=''; tiles.innerHTML=''; pos=0; ctx.say(X.msg);
    var ss=[]; for(var i=0;i<w.length;i++){var s=el('div','cj-wslot');ss.push(s);slots.appendChild(s)}
    var letters=w.split(''), mix=letters, tries=0; do{mix=shuffle(letters);tries++}while(mix.join('')===w&&tries<10);
    mix.forEach(function(ch){
      var t=el('button','cj-wtile'); t.textContent=ch;
      t.addEventListener('click',function(){
        if(t.classList.contains('used'))return;
        if(ch===w.charAt(pos)){ss[pos].textContent=ch;ss[pos].classList.add('on');t.classList.add('used');pos++;sfx('tap');
          if(pos===w.length){ctx.say(X.fim);sfx('win');ctx.clue();ctx.later(ctx.done,1200)}}
        else{t.classList.add('wrong');ctx.later(function(){t.classList.remove('wrong')},450);sfx('no');ctx.say(X.errou)}
      });
      tiles.appendChild(t);
    });
  }};
};

/* ----- Lanterna (iluminar o escuro e achar os itens) ----- */
TYPES.lanterna=function(m,ctx){
  var X=m.textos, A=m.alvos, R=m.raio||16, box=el('div'), dark=el('div','cj-darkov'), items=[], found=0, over=false, lx=50, ly=55;
  box.appendChild(dark); ctx.s.insertBefore(box,ctx.char);
  function light(x,y){lx=x;ly=y;dark.style.setProperty('--lx',x+'%');dark.style.setProperty('--ly',y+'%')}
  function near(p){var r=stage.getBoundingClientRect(),dx=(lx-p[0])*r.width/100,dy=(ly-p[1])*r.height/100;return Math.sqrt(dx*dx+dy*dy)<R*r.width/100*0.95}
  function mv(e){if(over)return;var p=stageXY(e);light(p.x,p.y)}
  ctx.s.addEventListener('pointermove',mv); ctx.s.addEventListener('pointerdown',mv);
  return {start:function(){
    over=false; found=0; ctx.s.style.touchAction='none'; items.forEach(function(i){i.remove()}); items=[]; dark.style.transition='none'; dark.style.opacity='1';
    dark.style.setProperty('--r','calc(var(--u)*'+R+')'); dark.style.setProperty('--r0','calc(var(--u)*'+(R*0.7)+')'); light(50,55); ctx.say(X.msg);
    A.forEach(function(p){
      var b=el('button','cj-item cj-hid show'+(m.item?' img':''),itemHtml(m,'<svg viewBox="0 0 100 100" style="fill:#f4c430;stroke:#8a6a00;stroke-width:3"><use href="#cjStar"/></svg>'));
      b.style.left=p[0]+'%'; b.style.top=p[1]+'%'; b.setAttribute('aria-label',T(X.rotulo||''));
      b.addEventListener('click',function(){
        if(over||b.classList.contains('got')||!near(p))return;
        b.classList.add('got'); sfx('star'); found++;
        if(found>=A.length){over=true;sfx('win');dark.style.transition='opacity .8s';dark.style.opacity='0';ctx.say(X.fim);ctx.clue();ctx.later(ctx.done,1500)}
        else ctx.say(String(X.falta).replace(/\{falta\}/g,A.length-found));
      });
      box.appendChild(b); items.push(b);
    });
  }};
};

/* ---------- Montagem das telas de missão e do HUD ---------- */
var INST=[];
(function buildMissions(){
  var host=$('cjMissions'), slots=$('cjSlots');
  MS.forEach(function(m,i){
    var g=G[m.guia||0]||G[0];
    var s=el('section','cj-scr'); s.id='sM'+i;
    var bg=el('div','cj-bg'); if(m.cenario)bg.style.backgroundImage=cssUrl(m.cenario); s.appendChild(bg);
    var bub=el('div','cj-bubble'), who=el('b'), txt=el('span'); who.textContent=g.nome; who.style.color=g.cor; bub.appendChild(who); bub.appendChild(txt); s.appendChild(bub);
    var ch=el('img','cj-char'); ch.alt=g.nome; if(g.img)ch.src=g.img; else ch.style.display='none';
    if(m.tipo!=='trilha'){
      var dir=(m.lado||(m.tipo==='presentes'||m.tipo==='cadeado'||m.tipo==='memoria'||m.tipo==='sequencia'||m.tipo==='palavra'?'dir':'esq'))==='dir';
      ch.setAttribute('style',dir?'right:-2%;bottom:0;width:calc(var(--u)*27)':'left:-3%;bottom:0;width:calc(var(--u)*30)');
    }
    s.appendChild(ch);
    var ph=el('div','cj-phase'); ph.textContent=N(TX.fase,i+1,MS.length); s.appendChild(ph);
    host.appendChild(s);
    var ctx={s:s,char:ch,say:function(h){txt.innerHTML=T(h)},sfx:sfx,esc:esc,el:el,later:later,every:every,
      clue:function(){gotClue(i)},
      done:function(){
        var p=m.pista;
        if(p&&(p.titulo||p.texto))modal({img:g.img,tag:clueTag(i),title:p.titulo,text:p.texto,next:function(){afterMission(i)}});
        else afterMission(i);
      }};
    INST[i]=(TYPES[m.tipo]||TYPES.trilha)(m,ctx);
    var d=el('div','cj-slot'+(m.tipo==='estrelas'?' star':''),'<svg viewBox="0 0 100 100"><use href="#'+(ICON[m.tipo]||'cjStar')+'"/></svg>');
    d.setAttribute('data-k',i); d.title=T(g.pista||''); slots.appendChild(d);
  });
})();
function enterMission(i){show('sM'+i); INST[i].start()}
function afterMission(i){if(i<MS.length-1)enterMission(i+1);else goEnvelope()}

/* ---------- Convite final: botões (link ou overlay) ---------- */
function openOverlay(i){sfx('tap');var o=$('cjOv'+i);if(o){o.classList.add('on');o.setAttribute('aria-hidden','false')}}
function closeOverlays(){document.querySelectorAll('#cj .cj-overlay').forEach(function(o){o.classList.remove('on');o.setAttribute('aria-hidden','true')})}
function askGo(b){
  var u=b.url||'#', zap=/wa\.me|whatsapp/i.test(u), box=$('cjGo');
  sfx('tap');
  $('cjGoT').textContent=zap?'Confirmar presença':'Local da festa';
  $('cjGoP').textContent=zap?'Você será direcionado ao WhatsApp para confirmar sua presença. Quer enviar a mensagem?':'Você será direcionado ao mapa para ver o local da festa. Quer abrir agora?';
  $('cjGoOk').textContent=zap?'Enviar no WhatsApp':'Ver no mapa'; $('cjGoOk').href=u;
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
}
function closeGo(){var g=$('cjGo');g.classList.remove('on');g.setAttribute('aria-hidden','true')}
$('cjGoBack').addEventListener('click',function(){sfx('tap');closeGo()});
$('cjGoOk').addEventListener('click',function(){setTimeout(closeGo,300)});
$('cjGo').addEventListener('click',function(ev){if(ev.target===this)closeGo()});
(function buildHots(){
  var hots=$('cjHots'), ovs=$('cjOverlays');
  CONFIG.botoes.forEach(function(b,i){
    var pos='left:'+b.left+'%;top:'+b.top+'%;width:'+b.width+'%;height:'+b.height+'%';
    if(b.tipo==='overlay'){
      var e=document.createElement('button'); e.className='cj-hot'; e.id='btn'+(i+1); e.setAttribute('style',pos); e.setAttribute('aria-label',b.rotulo||'');
      e.addEventListener('click',function(){openOverlay(i)}); hots.appendChild(e);
      var ov=document.createElement('div'); ov.className='cj-overlay'; ov.id='cjOv'+i; ov.setAttribute('aria-hidden','true');
      ov.innerHTML='<div class="cj-ov-box"><img alt="'+esc(b.rotulo||'')+'" src="'+esc(b.imagem||'')+'"><button class="cj-x" aria-label="'+esc(T(TX.fechar))+'"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button></div>';
      ov.querySelector('.cj-x').addEventListener('click',function(ev){ev.stopPropagation();sfx('tap');closeOverlays()});
      ov.addEventListener('click',function(ev){if(ev.target===ov)closeOverlays()});
      ovs.appendChild(ov);
    }else{
      var a=document.createElement('a'); a.className='cj-hot'; a.id='btn'+(i+1); a.target='_blank'; a.rel='noopener noreferrer'; a.href=b.url||'#';
      a.setAttribute('style',pos); a.setAttribute('aria-label',b.rotulo||''); hots.appendChild(a);
      a.addEventListener('click',function(ev){ev.preventDefault();askGo(b)});
    }
  });
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeOverlays();closeGo()}});

function showInvite(){stopVideo();show('sInv');playMusic();setTimeout(confetti,400)}
$('cjReplay').addEventListener('click',function(){

  closeOverlays(); enterMission(0);

/* ---------- Confete ---------- */
function confetti(){
  var cv=$('cjConfetti'), ctx=cv.getContext('2d'), W=cv.width=stage.clientWidth*2, H=cv.height=stage.clientHeight*2;
  var cols=CONFIG.confete, ps=[];
  for(var i=0;i<160;i++)ps.push({x:Math.random()*W,y:-Math.random()*H*.6,w:8+Math.random()*12,h:6+Math.random()*8,vy:4+Math.random()*6,vx:-2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
  var t0=performance.now();
  (function loop(t){
    ctx.clearRect(0,0,W,H); var el=t-t0;
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=el>3500?Math.max(0,1-(el-3500)/1000):1;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(el<4600)requestAnimationFrame(loop);else ctx.clearRect(0,0,W,H);
  })(t0);
}
})();
